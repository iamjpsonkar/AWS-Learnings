name: Test Lab Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-python:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            40-local-cloud-lab-platform/api/requirements.txt
            40-local-cloud-lab-platform/lab-runner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r 40-local-cloud-lab-platform/api/requirements.txt \
            -r 40-local-cloud-lab-platform/lab-runner/requirements.txt \
            pytest \
            pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest -q \
            40-local-cloud-lab-platform/tests \
            40-local-cloud-lab-platform/api/tests

  validate-config:
    name: Scripts and Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate repository tooling
        run: |
          ./scripts/validate-repo.sh --brand --readmes --alt --line-endings

      - name: Check shell syntax
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      - name: Validate Compose models
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f 40-local-cloud-lab-platform/docker-compose.yml config --quiet
